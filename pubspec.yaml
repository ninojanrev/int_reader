name: epub_reader
description: Android EPUB reader
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.0
  epub_plus: ^5.1.0
  sqflite: ^2.3.0
  path: ^1.8.0
  file_picker: ^12.0.0
  provider: ^6.0.0
  uuid: ^4.0.0
  path_provider: ^2.1.0
  flutter_html: ^3.0.0
  image: ^4.0.0
  wakelock_plus: ^1.7.0
  url_launcher: ^6.2.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_colorpicker: ^1.1.0
  markdown: ^7.3.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  sqflite_common_ffi: ^2.3.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/branding/int_reader_logo.png"
  android: true
  adaptive_icon_background: "#F0EDE8"
  adaptive_icon_foreground: "assets/branding/int_reader_logo.png"

flutter:
  uses-material-design: true

  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather.ttf
    - family: Atkinson Hyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible.ttf

  assets:
    - assets/fonts/
